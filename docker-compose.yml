services:
  # -------------------------------------------------------------
  # 1. Database Service: PostgreSQL 16
  # -------------------------------------------------------------
  tiktok-postgres:
    image: postgres:16-alpine
    container_name: tiktok-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:-tiktok_catalog}
    ports:
      # Bound to loopback only: the database is never exposed on the LAN.
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-tiktok_catalog}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # 2. Web Storefront Service: TikTok Viewer (Port 3000)
  # -------------------------------------------------------------
  tiktok-viewer:
    build:
      context: .
      dockerfile: ./tiktok-viewer/Dockerfile
    container_name: tiktok-viewer
    restart: always
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD}@tiktok-postgres:5432/${DB_NAME:-tiktok_catalog}
      - APP_URL=${NEXT_PUBLIC_VIEWER_URL:-http://localhost:3000}
      - TIKTOK_CLIENT_KEY=${TIKTOK_CLIENT_KEY:-}
      - TIKTOK_CLIENT_SECRET=${TIKTOK_CLIENT_SECRET:-}
    ports:
      - "127.0.0.1:${PORT_VIEWER:-3000}:3000"
    volumes:
      - ./tiktok-viewer/src:/app/tiktok-viewer/src
      - ./packages:/app/packages
    depends_on:
      tiktok-postgres:
        condition: service_healthy

  # -------------------------------------------------------------
  # 3. Web Admin Service: TikTok Backoffice (Port 3001)
  # -------------------------------------------------------------
  tiktok-backoffice:
    build:
      context: .
      dockerfile: ./tiktok-backoffice/Dockerfile
    container_name: tiktok-backoffice
    restart: always
    environment:
      - NODE_ENV=development
      - PORT=3001
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD}@tiktok-postgres:5432/${DB_NAME:-tiktok_catalog}
      - APP_URL=${NEXT_PUBLIC_BACKOFFICE_URL:-http://localhost:3001}
      - TIKTOK_CLIENT_KEY=${TIKTOK_CLIENT_KEY:-}
      - TIKTOK_CLIENT_SECRET=${TIKTOK_CLIENT_SECRET:-}
    ports:
      - "127.0.0.1:${PORT_BACKOFFICE:-3001}:3001"
    volumes:
      - ./tiktok-backoffice/src:/app/tiktok-backoffice/src
      - ./packages:/app/packages
    depends_on:
      tiktok-postgres:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
